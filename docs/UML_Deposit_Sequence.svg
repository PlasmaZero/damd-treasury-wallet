<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1140" viewBox="0 0 1600 1140"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,1 L10,6 L2,11" fill="none" stroke="#21334B" stroke-width="1.5"/></marker><marker id="diamond" markerWidth="16" markerHeight="12" refX="1" refY="6" orient="auto"><path d="M1,6 L8,1 L15,6 L8,11 Z" fill="#21334B"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="60" y="55" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#53657D" text-anchor="start">DAMD  /  CSE 416  /  MILESTONE 2</text><text x="60" y="105" font-family="DejaVu Sans,sans-serif" font-size="36" font-weight="700" fill="#21334B" text-anchor="start">UML sequence diagram — deposit</text><text x="60" y="143" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#53657D" text-anchor="start">Precondition: local contract is deployed and the user has connected MetaMask on chain 1337</text><rect x="20" y="190" width="190" height="55" fill="#EAF2FD" stroke="#21334B" stroke-width="1.5"/><text x="115" y="225" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#21334B" text-anchor="middle">User</text><path d="M 115,245 L 115,1000" fill="none" stroke="#21334B" stroke-width="1.6" stroke-dasharray="7 6"/><rect x="340" y="190" width="190" height="55" fill="#EAF2FD" stroke="#21334B" stroke-width="1.5"/><text x="435" y="225" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#21334B" text-anchor="middle">Dashboard</text><path d="M 435,245 L 435,1000" fill="none" stroke="#21334B" stroke-width="1.6" stroke-dasharray="7 6"/><rect x="660" y="190" width="190" height="55" fill="#EAF2FD" stroke="#21334B" stroke-width="1.5"/><text x="755" y="225" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#21334B" text-anchor="middle">WalletService</text><path d="M 755,245 L 755,1000" fill="none" stroke="#21334B" stroke-width="1.6" stroke-dasharray="7 6"/><rect x="980" y="190" width="190" height="55" fill="#EAF2FD" stroke="#21334B" stroke-width="1.5"/><text x="1075" y="225" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#21334B" text-anchor="middle">MetaMask</text><path d="M 1075,245 L 1075,1000" fill="none" stroke="#21334B" stroke-width="1.6" stroke-dasharray="7 6"/><rect x="1340" y="190" width="190" height="55" fill="#E8F5EE" stroke="#21334B" stroke-width="1.5"/><text x="1435" y="225" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="700" fill="#21334B" text-anchor="middle">Treasury</text><path d="M 1435,245 L 1435,1000" fill="none" stroke="#21334B" stroke-width="1.6" stroke-dasharray="7 6"/><path d="M 115,300 L 435,300" fill="none" stroke="#21334B" stroke-width="1.6" marker-end="url(#arrow)"/><text x="275.0" y="288" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="middle">Enter amount; click Deposit</text><path d="M 435,365 L 755,365" fill="none" stroke="#21334B" stroke-width="1.6" marker-end="url(#arrow)"/><text x="595.0" y="353" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="middle">deposit(amount)</text><path d="M 755,430 L 1075,430" fill="none" stroke="#21334B" stroke-width="1.6" marker-end="url(#arrow)"/><text x="915.0" y="418" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="middle">Request signed ETH transfer</text><path d="M 1075,495 L 1435,495" fill="none" stroke="#21334B" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1255.0" y="483" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="middle">Submit deposit via RPC¹</text><rect x="1190" y="515" width="350" height="75" fill="#FFF5D9" stroke="#21334B" stroke-width="1.5"/><text x="1204" y="545" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="start">Accept ETH; emit Deposited.</text><text x="1204" y="573" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="start">Contract balance increases.</text><path d="M 1075,630 L 755,630" fill="none" stroke="#21334B" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="915.0" y="618" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="middle">Transaction response</text><path d="M 755,685 L 435,685" fill="none" stroke="#21334B" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="595.0" y="673" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="middle">Transaction response</text><rect x="285" y="710" width="690" height="58" fill="#FFF5D9" stroke="#21334B" stroke-width="1.5"/><text x="303" y="745" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="start">Dashboard waits for a successful receipt: transaction.wait().</text><path d="M 435,820 L 755,820" fill="none" stroke="#21334B" stroke-width="1.6" marker-end="url(#arrow)"/><text x="595.0" y="808" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="middle">getBalance()</text><path d="M 755,875 L 1435,875" fill="none" stroke="#21334B" stroke-width="1.6" marker-end="url(#arrow)"/><text x="1095.0" y="863" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="middle">getBalance() via read-only RPC</text><path d="M 1435,930 L 755,930" fill="none" stroke="#21334B" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="1095.0" y="918" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="middle">Balance in wei</text><path d="M 755,985 L 435,985" fill="none" stroke="#21334B" stroke-width="1.6" stroke-dasharray="7 6" marker-end="url(#arrow)"/><text x="595.0" y="973" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#21334B" text-anchor="middle">Formatted ETH balance</text><text x="60" y="1045" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#53657D" text-anchor="start">¹ RPC transport and EVM execution are abstracted. The transaction response alone is not confirmation.</text><text x="60" y="1080" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#53657D" text-anchor="start">The dashboard shows success after confirmation; wallet rejection or transaction failure displays an error.</text><text x="60" y="1115" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#53657D" text-anchor="start">Balance reads require no signature. MetaMask keeps the private key; the application never receives it.</text></svg>