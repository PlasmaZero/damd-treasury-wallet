rt">send deposit</text><rect x="60" y="730" width="620" height="130" fill="#FFF5D9" stroke="#21334B" stroke-width="1.5"/><text x="80" y="767" font-family="DejaVu Sans,sans-serif" font-size="22" font-weight="700" fill="#21334B" text-anchor="start">Planned for later milestones</text><text x="80" y="805" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#21334B" text-anchor="start">Multisignature payments, spending limits,</text><text x="80" y="835" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#21334B" text-anchor="start">timelocks, and social recovery.</text><text x="60" y="958" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53657D" text-anchor="start">+ public interface    − internal/private    dashed arrow = dependency</text><text x="60" y="997" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#53657D" text-anchor="start">App and WalletService are logical classifiers; JavaScript uses functions and closures.</text><text x="60" y="1035" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="700" fill="#53657D" text-anchor="start">This version has no owners, Payment records, approvals, or withdrawals.</text></svg>