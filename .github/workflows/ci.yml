name: CI
# Local checks only. Sepolia contracts are deployed manually (npm run deploy -- --network sepolia)
# and the frontend is published by pages.yml, so this workflow holds no keys and sends no transactions.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- src/contract/abi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
