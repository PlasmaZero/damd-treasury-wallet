name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_sepolia:
        description: Deploy and verify the public Sepolia test fixture
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- src/contract/abi
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:sepolia:rehearse

  sepolia:
    name: Deploy and verify public Sepolia
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.SEPOLIA_DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy_sepolia))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: sepolia
    concurrency:
      group: sepolia-deployment
      cancel-in-progress: false
    env:
      SEPOLIA_BROWSER_RPC_URL: ${{ vars.SEPOLIA_BROWSER_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Deploy and exercise contracts on public Sepolia then verify their source
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SEPOLIA_MAX_SPEND_ETH: '0.1'
          SEPOLIA_MAX_FEE_GWEI: '10'
          SEPOLIA_CONFIRMATIONS: '2'
        run: npm run test:sepolia
      - name: Build the frontend for the actual Sepolia deployment
        env:
          VITE_USE_MOCK: 'false'
          VITE_CHAIN_ID: '11155111'
          VITE_RPC_URL: ${{ vars.SEPOLIA_BROWSER_RPC_URL }}
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the production frontend against public chain state
        run: npm run test:sepolia:ui
      - name: Publish the acceptance summary
        if: always()
        run: npm run test:sepolia:summary
      - name: Save public deployment evidence even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sepolia-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            test-results/sepolia/
            deployments/11155111.json
            public/deployments/11155111.json
            artifacts/standard-input.json
      - name: Save the frontend built for this public deployment
        uses: actions/upload-artifact@v4
        with:
          name: sepolia-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
